<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
  <meta charset="utf-8" />
  <title>Внутрішня помилка сервера</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #1e3a5f;
      --gray-50: #f8fafc;
      --gray-600: #475569;
      --gray-900: #0f172a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--gray-50);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--gray-900);
      padding: 24px;
    }
    .error-box {
      text-align: center;
      max-width: 480px;
    }
    .badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.1);
      color: var(--primary);
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px;
    }
    p {
      color: var(--gray-600);
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s ease;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="error-box">
    <span class="badge">Помилка 500</span>
    <h1>Щось пішло не так</h1>
    <p>
      На сервері сталася технічна помилка. Ми вже працюємо над її вирішенням —
      спробуйте оновити сторінку за кілька хвилин.
    </p>
    <a href="/" class="btn">На головну</a>
  </div>
</body>
</html>
